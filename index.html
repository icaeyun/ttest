<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>출발 위치 설정</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 로딩 스플래시 -->
  <div id="splash" class="splash" role="alert" aria-live="assertive">
    <div class="splash-inner">
      <div class="splash-spinner"></div>
      <p class="splash-text">현재 위치 확인 중</p>
      <p class="splash-sub" id="splash-sub" hidden></p>
    </div>
  </div>

  <!-- 메인 앱 -->
  <div id="app" class="app hidden">

    <!-- 상단 플로팅 뒤로가기 버튼 (Figma 스타일) -->
    <button class="btn-back-floating" aria-label="뒤로 가기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 19l-7-7 7-7" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- 스크린리더 전용 안내 -->
    <div class="sr-only" role="status" aria-live="polite">
      지도를 손가락으로 드래그하면 출발 위치가 이동합니다.
      손을 떼면 현재 핀 위치를 음성으로 안내합니다.
    </div>

    <!-- 지도 영역 -->
    <div id="map-wrap" class="map-wrap" role="application"
         aria-label="출발 위치 선택 지도. 드래그하여 핀 위치를 조정하세요.">
      <div id="map" class="map"></div>

      <!-- CSS 전용 중앙 고정 핀 (Figma 스타일: 작은 출발 핀) -->
      <div id="center-pin" class="center-pin" aria-hidden="true">
        <div class="pin-label">출발</div>
        <div class="pin-stem"></div>
        <div class="pin-dot"></div>
      </div>
    </div>

    <!-- 현재 위치 FAB -->
    <button id="btn-my-location" class="fab-my-location" aria-label="현재 위치로 이동">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" fill="#1A1A1A"/>
        <circle cx="12" cy="12" r="7" stroke="#1A1A1A" stroke-width="1.8" fill="none"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"
              stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- 하단 시트 (Figma 컴포넌트 스타일) -->
    <div class="bottom-sheet" role="region" aria-label="출발 위치 정보">
      <div class="sheet-handle" aria-hidden="true"><span></span></div>

      <!-- 현위치 행 -->
      <div class="sheet-row sheet-row-current">
        <span class="row-bullet bullet-current" aria-hidden="true"></span>
        <div class="row-content">
          <span class="row-label">현위치</span>
          <span id="location-name" class="row-value">위치를 확인하고 있습니다</span>
        </div>
      </div>

      <!-- 안내 영역 (스크린리더용 + 시각적 보조 안내) -->
      <div id="announce-region" class="announce-region"
           role="status" aria-live="off" aria-atomic="true">
        지도를 움직여 출발 위치를 설정하세요.
      </div>

      <!-- 어디로 갈까요? 행 -->
      <div class="sheet-row sheet-row-dest" role="button" tabindex="0"
           aria-label="목적지 입력">
        <span class="row-bullet bullet-dest" aria-hidden="true"></span>
        <div class="row-content">
          <span class="row-value row-placeholder">어디로 갈까요?</span>
        </div>
        <span class="row-chevron" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="#9CA3AF" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>

      <!-- 즐겨찾기 / 최근 칩 영역 -->
      <div class="chip-row" role="group" aria-label="즐겨찾기 및 최근 장소">
        <button class="chip chip-fav" type="button" aria-label="집으로 설정">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V11z"
                  stroke="#1A1A1A" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>집</span>
        </button>
        <button class="chip chip-fav" type="button" aria-label="회사 추가">
          <span class="chip-plus" aria-hidden="true">+</span>
          <span>회사</span>
        </button>
        <button class="chip chip-recent" type="button">최근 장소</button>
        <button class="chip chip-recent" type="button">즐겨찾기</button>
      </div>

      <!-- 여기서 출발 (기존 기능 유지) -->
      <div class="action-row">
        <button id="btn-confirm" class="btn-action btn-confirm-location" type="button">
          <span>여기서 출발</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Kakao Maps SDK (기존 로드 방식 그대로 유지) -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=93fb3b70693c7f3aba7c97dd76479fd7&libraries=services&autoload=false"
    onerror="console.error('[Kakao SDK script 로드 실패]')">
  </script>
  <script src="main.js"></script>
</body>
</html>
